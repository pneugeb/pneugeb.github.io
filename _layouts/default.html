<!doctype html>
<html lang="en">
<head>
  {% include head.html %}
  {% unless page.title == 'Home' %}
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        macros: {
          bra: ["\\langle #1\\rvert", 1],
          ket: ["\\lvert #1\\rangle", 1],
          braket: ["\\langle #1 \\rvert #2 \\rangle", 2],
          expect: ["\\langle #1 \\rangle", 1]
        }
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  {% endunless %}
</head>
<body class="{% if page.title == 'Home' %}home-page{% else %}reading-page{% endif %}">
  <a class="skip-link" href="#content">Skip to content</a>
  <main id="content">
    {{ content }}
  </main>
  {% unless page.title == 'Home' %}{% include footer.html %}{% endunless %}
  {% unless page.title == 'Home' %}
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  {% endunless %}
  <script src="{{ '/js/theme.js' | relative_url }}"></script>
  {% if page.title == 'Home' %}<script defer src="{{ '/js/observatory.js' | relative_url }}"></script>{% endif %}
</body>
</html>
